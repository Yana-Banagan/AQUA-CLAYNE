name: mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  app_links: ^6.4.1
  cupertino_icons: ^1.0.8
